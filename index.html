<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta name="description" content="Câmeras ao vivo da Ponte da Amizade: CDE para Foz e Foz para CDE.">
  <title>Ponte da Amizade ao vivo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <span class="live-pill"><i aria-hidden="true"></i> Ao vivo</span>
      <h1>Ponte da Amizade</h1>
      <p>Escolha o sentido e abra o player direto.</p>
    </header>

    <section class="control-card" aria-label="Selecionar câmera">
      <div class="switcher" role="tablist" aria-label="Sentido da câmera">
        <button class="switch-button is-active" type="button" role="tab" aria-selected="true" data-camera="brasil">
          CDE → Foz
        </button>
        <button class="switch-button" type="button" role="tab" aria-selected="false" data-camera="paraguai">
          Foz → CDE
        </button>
      </div>

      <div class="direction-panel">
        <span class="route-code" id="routeCode">CDE → Foz</span>
        <strong id="routeName">Sentido Brasil</strong>
        <p id="routeHelp">Ciudad del Este para Foz do Iguaçu.</p>
      </div>

      <a class="open-button" id="openCamera" href="https://playerv.logicahost.com.br/video-ip-camera/portovelhomamore//true/true/V2tjeGMyRXhjRmhQU0dSUFVYcFdlbGxxU210alJtdDVVbTA1YVUwd05IZFVSekZQWkcxS1ZFNVhiR3BhZWpBNStS/16:9/V1ZWb1UwMUhUa2xVVkZwTlpWUm5PUT09K1I=/fozpontedaamizadesentidobrasil.stream/?autoplay=1&muted=1">
        Abrir câmera
      </a>

      <p class="provider-note">O provedor bloqueia duas transmissões embutidas na mesma página; este app abre o player direto.</p>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
